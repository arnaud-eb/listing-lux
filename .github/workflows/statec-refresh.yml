# Quarterly refresh of commune asking-prices in data/lu-localities.json from
# STATEC / Observatoire de l'Habitat ("Prix annoncés des logements - Par
# commune", data.public.lu, CC0), then opens a PR. Once merged, seed-localities.yml
# syncs the updated JSON to Supabase (it triggers on push to that file).
#
# The fetcher resolves the current download URLs from the data.public.lu API
# itself — no repo secrets or variables are needed.
#
# Schedule: 4 AM UTC every Monday. STATEC publishes quarterly but on no fixed
# day, so a calendar guess would miss late releases. Instead the fetcher checks
# the dataset's last_modified on every run and exits early when nothing changed
# — so a weekly cron catches a new release within days, and the ~48 no-op runs
# a year each cost a few seconds of free CI time (no diff → no PR).

name: STATEC refresh

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run fetcher only (no PR)"
        type: boolean
        default: false

concurrency:
  group: statec-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run fetcher
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bun run statec:fetch --dry-run
          else
            bun run statec:fetch
          fi

      - name: Open PR with price diff
        if: ${{ inputs.dry_run != true }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/statec-refresh
          commit-message: "chore(localities): refresh STATEC asking prices"
          title: "chore(localities): STATEC asking-price refresh"
          body: |
            Automated quarterly refresh of `data/lu-localities.json` from STATEC /
            Observatoire de l'Habitat ("Prix annoncés des logements - Par commune",
            data.public.lu, CC0).

            - Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>

            Review the JSON diff. Any commune that moved >30% quarter-over-quarter
            already failed the fetcher, so every value here is within sanity bounds.
            Once merged, seed-localities.yml syncs the change to Supabase.
          labels: localities, automated
          delete-branch: true
