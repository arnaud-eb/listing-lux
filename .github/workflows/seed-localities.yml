# Re-seed of the Supabase `localities` table from the checked-in
# `data/lu-localities.json` snapshot. Idempotent.
#
# Audit P1.1a (docs/audits/2026-04-llm-output-audit/README.md §5).
#
# Triggers:
#   - push to main when data/lu-localities.json changes — the natural signal
#     (covers STATEC refresh PRs from statec-refresh.yml merging, and any hand-edits)
#   - quarterly cron — safety net in case a push trigger is ever skipped
#   - workflow_dispatch — manual runs / dry-runs
#
# Required repo secrets:
#   NEXT_PUBLIC_SUPABASE_URL    — public Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY   — server-side service role (NEVER share)
#
# Optional repo secrets (cache revalidation — POSTs to /api/admin/revalidate-localities
# after a successful upsert so the running app picks up new rows without waiting
# for the natural cache TTL):
#   LOCALITIES_REVALIDATE_URL     — base URL of the production app
#   LOCALITIES_REVALIDATE_SECRET  — shared secret matching the route handler

name: Seed localities

on:
  push:
    branches: [main]
    paths:
      - "data/lu-localities.json"
      - "scripts/seed-localities.ts"
      - ".github/workflows/seed-localities.yml"
  schedule:
    - cron: "0 4 1 */3 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run validator only (no DB writes)"
        type: boolean
        default: false

# Don't pile up overlapping runs if a previous one hasn't finished.
concurrency:
  group: seed-localities
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # --frozen-lockfile guards against an unrelated lockfile drift turning
        # the cron into a surprise upgrade run.
        run: bun install --frozen-lockfile

      - name: Run seed
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOCALITIES_REVALIDATE_URL: ${{ secrets.LOCALITIES_REVALIDATE_URL }}
          LOCALITIES_REVALIDATE_SECRET: ${{ secrets.LOCALITIES_REVALIDATE_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bun run seed:localities --dry-run
          else
            bun run seed:localities
          fi
