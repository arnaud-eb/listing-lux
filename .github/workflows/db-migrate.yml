# Apply Supabase migrations to the production project.
#
# Trigger model: any change to supabase/migrations/** merged to main runs
# `supabase db push`, which is idempotent — the CLI consults
# supabase_migrations.schema_migrations on the remote and skips files that
# already applied, so re-runs after a rollback or a no-op deploy are safe.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN   — personal access token (Account → Access Tokens)
#   SUPABASE_PROJECT_REF    — prod project ref (the <ref> in <ref>.supabase.co)
#   SUPABASE_DB_PASSWORD    — DB password set when the prod project was created
#
# Failure semantics: a failed migration aborts mid-file. Fix forward with a
# new migration; never edit a migration that has already applied to prod.

name: DB migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link prod project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Push migrations
        run: supabase db push
